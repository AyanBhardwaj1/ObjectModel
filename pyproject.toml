[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "objectmodel"
version = "0.1.0"
description = "Turn observations of real articulated objects into validated, simulation-ready URDF/MJCF digital twins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
sim = ["mujoco>=3.0"]
video = ["opencv-python-headless>=4.8"]
dev = ["pytest>=7", "mujoco>=3.0", "opencv-python-headless>=4.8"]

[project.scripts]
objectmodel = "objectmodel.cli:main"

[tool.setuptools]
packages = ["objectmodel"]

[tool.setuptools.package-data]
objectmodel = ["viewer_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
