name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Build the C++ core
        run: |
          sudo apt-get update && sudo apt-get install -y libeigen3-dev
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release && cmake --build cpp/build
      - run: python -m pytest -q
      - name: C++ parity and timing
        run: python -m objectmodel.native
      - name: Benchmark smoke test
        run: python -m objectmodel bench --seeds 1 --noise 1
